<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinSec · 本地审计轨迹查看器</title>
<style>
:root{--blue:#005bac;--ink:#163e60;--line:#d7e4ef}*{box-sizing:border-box}body{margin:0;background:#f2f6fa;color:var(--ink);font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}header{padding:24px 6%;background:white;border-top:6px solid var(--blue);border-bottom:1px solid var(--line)}h1{margin:0;font-size:28px}main{max-width:1340px;margin:24px auto;padding:0 24px}.card,.step{background:white;border:1px solid var(--line);border-radius:8px;padding:18px;margin:14px 0}h2{font-size:19px;margin:0 0 10px}h3{font-size:15px;margin:0 0 6px}.muted{color:#6b8196}.grid{display:grid;grid-template-columns:.85fr 1.2fr;gap:18px}pre{white-space:pre-wrap;overflow:auto;word-break:break-word;font:13px/1.65 ui-monospace,Consolas,monospace;max-height:460px}.step{border-left:4px solid var(--blue)}.tool{border-left-color:#16867a;background:#f0faf7}.repair{border-left-color:#8b72ad}input,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--ink)}details{margin:10px 0}summary{cursor:pointer;color:var(--blue)}code{color:var(--blue)}#content[hidden]{display:none}@media(max-width:850px){.grid{grid-template-columns:1fr}h1{font-size:22px}}
</style><header><h1>FinSec · 密码学代码审计轨迹</h1><div class="muted">本地加载输入源码、模型生成、工具调用、真实返回与结论</div></header><main>
<div class="card"><h2>选择本地记录</h2><p>支持 <code>finsec.py audit</code> 生成的 <code>audit.json</code>、工具接线检查JSON，以及比赛程序包中的案例数组。记录只在当前浏览器解析，不上传。</p><input id="file" type="file" accept=".json"><select id="cases" hidden aria-label="切换案例"></select><p id="status" class="muted">运行本地审计或 <code>node submission_tools/tool_loop_smoke.mjs</code>，再选择生成的JSON。公开页面不预置训练数据或历史模型轨迹。</p></div>
<section id="content" hidden><div class="grid"><aside><div class="card"><h2 id="title">源码输入</h2><pre id="source"></pre></div><div class="card"><h2>执行概览</h2><div id="scope"></div></div></aside><div><div id="trace"></div><div class="card"><h2>最终结论</h2><pre id="findings"></pre></div></div></div></section>
</main><script>
const $=id=>document.getElementById(id);let records=[];
const el=(tag,text,cls)=>{const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e};
const pretty=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
function normalize(x){
 if(x.case&&x.prediction)return {file:x.case.file,source:x.case.code,result:x.prediction.result,findings:x.prediction.findings,scope:'加载的历史审计记录'};
 return {file:x.file??x.input?.file??'本地案例',source:x.input_source??x.input?.code??'',result:x.result??{trace:x.events??[]},findings:x.findings??[],scope:x.model_inference_performed===false?'工具接线检查：脚本化回复 + 真正Pi工具执行，未进行模型推理':`加载的审计记录 · ${x.model??'local model'}`};
}
function render(){const x=records[Number($('cases').value)||0];$('title').textContent=x.file;$('source').textContent=x.source||'当前记录未保存输入源码。';$('scope').textContent=x.scope;$('trace').replaceChildren();
 (x.result?.trace??[]).forEach((t,i)=>{const tool=t.kind==='tool',box=el('article','',`step ${tool?'tool':t.kind==='model_format_repair'?'repair':''}`);box.append(el('h3',`${i+1}. ${tool?'工具实际执行 · '+t.name:t.kind==='model_format_repair'?'输出格式修复':'模型生成'}`));
 if(tool){const args=document.createElement('details');args.append(el('summary','调用参数'),el('pre',pretty(t.arguments)));const keys=['status','exit_code','test_passed','stdout','stderr','timed_out','seconds','path','written','content','matches','rules','candidates'];const v=t.result??{};const summary=Object.fromEntries(keys.filter(k=>Object.hasOwn(v,k)).map(k=>[k,v[k]]));const raw=document.createElement('details');raw.append(el('summary','完整原始返回'),el('pre',pretty(v)));box.append(args,el('pre',pretty(Object.keys(summary).length?summary:v)),raw)}
 else box.append(el('pre',t.raw??t.text??''));$('trace').append(box)});
 $('findings').textContent=pretty({findings:x.findings});$('content').hidden=false;
}
$('file').onchange=async e=>{try{const value=JSON.parse(await e.target.files[0].text());records=(Array.isArray(value)?value:[value]).map(normalize);if(!records.length)throw Error('记录为空');$('cases').replaceChildren();records.forEach((x,i)=>{const o=el('option',x.file);o.value=i;$('cases').append(o)});$('cases').hidden=records.length<2;$('status').textContent=`已加载${records.length}个本地案例；未发起网络请求。`;render()}catch(err){$('status').textContent='无法读取：'+err.message;$('content').hidden=true}};
$('cases').onchange=render;
</script></html>
